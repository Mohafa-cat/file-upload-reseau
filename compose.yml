services:
    web:
        build: .
        ports:
            - "8000:80"
    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: vulnerable
            MYSQL_USER: vuln
            MYSQL_PASSWORD: vulnpass
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

